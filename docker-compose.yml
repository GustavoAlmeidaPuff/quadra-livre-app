services:
  postgres:
    image: postgres:16-alpine
    container_name: quadra-livre-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quadra
      POSTGRES_PASSWORD: quadra
      POSTGRES_DB: quadra_livre
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadra -d quadra_livre"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
